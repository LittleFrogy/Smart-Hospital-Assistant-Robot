<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 456" width="680" height="456" role="img">
<title>Dispenser unit wiring</title>
<desc>A 5V 2A USB adapter or a 3S LiPo with an LM2596 feeds a 5V rail. That rail powers the ESP32 DevKit VIN and the SG90 red wire. GPIO18 drives the servo signal and GPIO2 drives the onboard heartbeat LED. An optional push button on GPIO4 uses the internal pull-up.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="456" fill="#FFFFFF"/>
<rect x="50" y="40" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="165.0" y="57" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#854F0B">5V 2A USB adapter</text>
<text x="165.0" y="75" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#854F0B">preferred - it never moves</text>
<rect x="50" y="105" width="230" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="165.0" y="122" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#854F0B">or 3S LiPo + LM2596</text>
<text x="165.0" y="140" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#854F0B">set to 5.00V, 470uF out</text>
<rect x="340" y="70" width="140" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="410.0" y="95" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#3C3489">5V rail</text>
<line x1="282" y1="65" x2="336" y2="88" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="282" y1="130" x2="336" y2="104" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M340 95 L205 95 L205 198" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M480 95 L500 95 L500 198" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="200" width="250" height="110" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="185.0" y="222" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#085041">ESP32 DevKit V1</text>
<text x="78" y="246" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">VIN &lt;- 5V rail</text>
<text x="78" y="263" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">GND &lt;- star ground</text>
<text x="78" y="280" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">GPIO18 -&gt; servo orange</text>
<text x="78" y="297" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">GPIO2 -&gt; onboard LED</text>
<rect x="370" y="200" width="250" height="110" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="495.0" y="222" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#712B13">SG90 drop gate</text>
<text x="388" y="246" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">red &lt;- 5V rail</text>
<text x="388" y="263" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">brown &lt;- star ground</text>
<text x="388" y="280" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">orange &lt;- GPIO18</text>
<text x="388" y="297" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">470uF across red/brown</text>
<line x1="310" y1="255" x2="368" y2="255" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="370" y="340" width="250" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="495.0" y="362" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#444441">Optional push button</text>
<text x="388" y="386" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5F5E5A">GPIO4 -&gt; button -&gt; GND</text>
<text x="388" y="403" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5F5E5A">INPUT_PULLUP, no resistor</text>
<line x1="495" y1="310" x2="495" y2="338" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
