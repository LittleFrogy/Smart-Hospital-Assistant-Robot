<rect x="60" y="530" width="90" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="105.0" y="546" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">GPIO16</text>
