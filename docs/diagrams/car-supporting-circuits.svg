<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" role="img">
<title>Car supporting circuits</title>
<desc>Three circuits. The echo divider: 5V echo through a 1 kilohm resistor to a junction feeding GPIO4, with a 2 kilohm resistor to ground, giving 3.33 volts. The buzzer drive: 5V rail through the buzzer to an S8050 collector-emitter to ground, base driven from GPIO19 through 1 kilohm, with a 1N4148 across the buzzer. The status LED: GPIO16 through 220 ohms to the LED anode, cathode to star ground.</desc>
