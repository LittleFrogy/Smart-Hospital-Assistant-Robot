<text x="218.0" y="128" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5F5E5A">1k</text>
<line x1="246" y1="128" x2="350" y2="128" stroke="#73726C" stroke-width="1.5"/>
<circle cx="300" cy="128" r="3.5" fill="#73726C"/>
<rect x="350" y="110" width="90" height="36" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="395.0" y="128" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">GPIO4</text>
<line x1="300" y1="128" x2="300" y2="155" stroke="#73726C" stroke-width="1.5"/>
<rect x="272" y="155" width="56" height="24" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="300.0" y="167" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5F5E5A">2k</text>
<line x1="300" y1="179" x2="300" y2="192" stroke="#73726C" stroke-width="1.5"/>
<line x1="284" y1="192" x2="316" y2="192" stroke="#73726C" stroke-width="1.5"/>
<line x1="290" y1="198" x2="310" y2="198" stroke="#73726C" stroke-width="1.5"/>
<line x1="295" y1="204" x2="305" y2="204" stroke="#73726C" stroke-width="1.5"/>
<rect x="460" y="105" width="160" height="50" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="540.0" y="122" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#854F0B">3.33V at GPIO4</text>
<text x="540.0" y="139" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#854F0B">measure before wiring</text>
