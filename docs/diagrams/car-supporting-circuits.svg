<rect width="680" height="640" fill="#FFFFFF"/>
<rect x="40" y="40" width="600" height="180" rx="8" fill="none" stroke="#73726C" stroke-width="1" stroke-dasharray="4 4"/>
<text x="58" y="62" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Ultrasonic ECHO divider - mandatory</text>
<rect x="60" y="110" width="90" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="105.0" y="128" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">ECHO 5V</text>
