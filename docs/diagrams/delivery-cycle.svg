<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 456" width="680" height="456" role="img">
<title>Delivery cycle</title>
<desc>Five stages in a loop: standby at station, load medicine, transit to bed, deliver, return to station, then back to standby.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="456" fill="#FFFFFF"/>
<rect x="180" y="40" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340.0" y="60" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#085041">Standby at station</text>
<text x="340.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">all five IR black, buzzer chirps</text>
<rect x="180" y="120" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340.0" y="140" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#085041">Load medicine</text>
<text x="340.0" y="158" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">website click, dispenser drops, lock closes</text>
<rect x="180" y="200" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#085041">Transit to bed</text>
<text x="340.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">line follow, sonar watching ahead</text>
<rect x="180" y="280" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340.0" y="300" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#3C3489">Deliver</text>
<text x="340.0" y="318" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#534AB7">scan QR, unlock, auto-lock after 30s</text>
<rect x="180" y="360" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340.0" y="380" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#085041">Return to station</text>
<text x="340.0" y="398" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">spin at turn zone, drive back</text>
<line x1="340" y1="96" x2="340" y2="118" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="340" y1="176" x2="340" y2="198" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="340" y1="256" x2="340" y2="278" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="340" y1="336" x2="340" y2="358" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M500 388 L570 388 L570 68 L503 68" fill="none" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
