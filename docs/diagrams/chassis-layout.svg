<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img">
<title>Chassis top view</title>
<desc>Top view with forward pointing up. The five channel IR array is at the leading edge with the ESP32-CAM just behind it. A ball caster sits near the front. The medicine compartment is in the middle. Two drive wheels at the rear, and the robot pivots about the midpoint of that rear axle.</desc>
