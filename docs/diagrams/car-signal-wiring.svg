<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 502" width="680" height="502" role="img">
<title>Car signal wiring by GPIO</title>
<desc>The ESP32 DevKit at centre. Inputs left: five channel IR array on GPIO 36, 39, 34, 35, 17; HC-SR04 trigger GPIO13 and echo via divider to GPIO4; ESP32-CAM power only. Outputs right: L298N on GPIO 14, 27, 26, 25, 32, 23; LCD on GPIO 21 and 22; servo GPIO18; buzzer GPIO19; LED GPIO16.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="502" fill="#FFFFFF"/>
<rect x="280" y="40" width="120" height="422" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340.0" y="228" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#3C3489">ESP32</text>
<text x="340.0" y="248" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#534AB7">DevKit V1</text>
<text x="340.0" y="266" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#534AB7">30-pin</text>
<rect x="40" y="40" width="210" height="140" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="145.0" y="60" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#085041">5-ch IR array</text>
<text x="58" y="82" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">OUT1 -&gt; GPIO36 (VP)</text>
<text x="58" y="99" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">OUT2 -&gt; GPIO39 (VN)</text>
<text x="58" y="116" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">OUT3 -&gt; GPIO34</text>
<text x="58" y="133" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">OUT4 -&gt; GPIO35</text>
<text x="58" y="150" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">OUT5 -&gt; GPIO17</text>
<text x="58" y="167" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">VCC -&gt; 3V3 pin, not 5V</text>
<rect x="40" y="200" width="210" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="145.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#085041">HC-SR04 sonar</text>
<text x="58" y="242" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">TRIG -&gt; GPIO13</text>
<text x="58" y="259" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">ECHO -&gt; divider -&gt; GPIO4</text>
<text x="58" y="276" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">VCC -&gt; 5V rail</text>
<rect x="40" y="310" width="210" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="145.0" y="330" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#085041">ESP32-CAM</text>
<text x="58" y="352" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">5V -&gt; 5V rail</text>
<text x="58" y="369" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">GND -&gt; star ground</text>
<text x="58" y="386" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">470uF at the module</text>
<rect x="430" y="40" width="210" height="140" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="535.0" y="60" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#712B13">L298N driver</text>
<text x="448" y="82" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">ENA -&gt; GPIO14 (PWM)</text>
<text x="448" y="99" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">IN1 -&gt; GPIO27</text>
<text x="448" y="116" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">IN2 -&gt; GPIO26</text>
<text x="448" y="133" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">IN3 -&gt; GPIO25</text>
<text x="448" y="150" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">IN4 -&gt; GPIO32</text>
<text x="448" y="167" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">ENB -&gt; GPIO23 (PWM)</text>
<rect x="430" y="200" width="210" height="90" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="535.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#712B13">LCD via BSS138</text>
<text x="448" y="242" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">SDA -&gt; LV1, GPIO21</text>
<text x="448" y="259" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">SCL -&gt; LV2, GPIO22</text>
<text x="448" y="276" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">LCD VCC -&gt; 5V rail</text>
<rect x="430" y="310" width="210" height="72" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="535.0" y="330" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#712B13">SG90 lock servo</text>
<text x="448" y="352" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">orange -&gt; LV3, GPIO18</text>
<text x="448" y="369" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">red -&gt; 5V, brown -&gt; GND</text>
<rect x="430" y="402" width="210" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="535.0" y="422" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#712B13">Buzzer and LED</text>
<text x="448" y="444" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#993C1D">GPIO19 buzzer, GPIO16 LED</text>
